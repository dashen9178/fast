<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>运行</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%235B4694'/><path d='M66 8 28 56h22l-12 36 44-50H58z' fill='white'/></svg>">
<link rel="stylesheet" href="runtime.css?v=__BUILD__">
</head>
<body>
<!-- 以前这里有整屏的 #splash「启动中…」遮罩，用户要求删掉：点运行/打开 App 时
     直接看到画面，不要再盖一层。方向没到位的空档由 runtime.js 的渲染门控制（同色底，
     不会再出现"先竖屏排好版再转横屏"的跳动）。 -->
<div id="app">
  <div id="viewport">
    <!-- #screen 为固定“设计画布”，由 JS 按设备等比缩放，保证与编辑器拖动布局完全一致 -->
    <div id="screen"></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<!-- 运行画面缩放（仅试运行预览显示）：－/＋ 调整，点百分比回到 100% -->
<div id="rtZoom" class="rt-zoom">
  <button id="rtZoomOut" type="button" aria-label="缩小画面">－</button>
  <button id="rtZoomPct" type="button" title="恢复 100%">100%</button>
  <button id="rtZoomIn" type="button" aria-label="放大画面">＋</button>
</div>
<!-- 结束试运行**不再有页面内按钮**：改由系统通知栏的卡片（《作品名》正在运行中 + 终止运行）结束，
     见 runtime.js 里的 Native.startRunNotice / window.__nativeStopRun。 -->
<script src="comp-spec.js?v=__BUILD__"></script>
<script src="qr.js?v=__BUILD__"></script>
<script src="runtime.js?v=__BUILD__"></script>
</body>
</html>
